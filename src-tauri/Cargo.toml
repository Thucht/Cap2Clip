[package]
name = "cap2clip"
version = "1.0.0"
description = "Fast screenshot capture and annotation for Windows"
authors = ["Thucht Software"]
license = "MIT"
homepage = "https://github.com/Thucht/Cap2Clip"
repository = "https://github.com/Thucht/Cap2Clip"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screenshots = "0.8"
base64 = "0.22"
dirs = "5"
arboard = "3"
time = "0.3"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
